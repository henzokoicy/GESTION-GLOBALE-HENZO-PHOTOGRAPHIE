<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des clients</title>
    <link rel="stylesheet" href="style_clients.css">
</head>
<body>

    <div >
        <h2>Nouveau client</h2>
        <form id="formulaire_add_clients">
          <label for="nom" >Nom et prénoms :</label><br>
          <input type="text" id="nom" name="nom"  placeholder="Ex : Henzo koicy" required><br><br>
    <div class="sexe">  
 <label>sexe :</label><br>
    <input type="radio" id="homme" name="sexe" value="homme"required>
<label for="homme">Homme</label>
    <input type="radio" id="femme" name="sexe" value="femme"required>
<label for="femme">Femme</label><br><br>
</div>    
<label for="ville">Ville :</label> 
<input type="text" id="ville" name="ville" placeholder="Ex : Bouaké"><br><br>
    
          <label for="note">Description du client :</label><br>
          <textarea name="note" id="note"></textarea><br><br>
    
          <button type="submit">Enregistrer</button>
        </form>
        

    </div>
    <div id="liste-clients">
        <h2>Liste des clients</h2>
        <ul id="clients"></ul>
      </div>
